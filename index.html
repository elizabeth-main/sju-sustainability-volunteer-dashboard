<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJU Hawk Hill | Sustainability Volunteer Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sjuRed: '#9E1B32',
            sjuDarkGreen: '#064e3b',
            sjuGreen: '#15803d',
            sjuLightGreen: '#f0fdf4'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

  <!-- Header / Navigation with Forest Green Background -->
  <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50 border-b-4 border-emerald-700">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2.5 bg-emerald-800 rounded-xl border border-emerald-600 flex items-center justify-center">
          <i class="fa-solid fa-leaf text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Saint Joseph's University | Hawk Hill Volunteer Hub</h1>
          <p class="text-xs text-emerald-200">Office of Sustainability & Local Community Opportunities • 5600 City Ave, Philadelphia, PA</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <!-- Direct mailto link to SJU Sustainability Office -->
        <a href="mailto:sustainability@sju.edu?subject=New%20Volunteer%20Opportunity%20Submission&body=Hello%20SJU%20Sustainability%20Office,%0A%0AI%20would%20like%20to%20submit%20the%20following%20volunteer%20opportunity%20for%20the%20Hawk%20Hill%20Dashboard:%0A%0A-%20Event%20Title:%20%0A-%20Organization:%20%0A-%20Date%20and%20Time:%20%0A-%20Location:%20%0A-%20Description:%20%0A-%20Registration/Contact%20Link:%20" 
           class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition flex items-center gap-2 shadow border border-emerald-500">
          <i class="fa-solid fa-envelope"></i> Submit Event / Project
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Filter & Search Controls -->
    <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4">
        
        <!-- Search bar -->
        <div class="relative flex-grow max-w-md">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" onkeyup="filterOpportunities()" placeholder="Search title, organization, or keyword..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
        </div>

        <!-- Location Filter Chips -->
        <div class="flex flex-wrap items-center gap-2 text-sm">
          <span class="text-slate-500 font-medium text-xs uppercase tracking-wider mr-1">Location:</span>
          <button onclick="setFilterLocation('all')" id="loc-all" class="filter-loc-btn bg-emerald-800 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold">All</button>
          <button onclick="setFilterLocation('on-campus')" id="loc-on-campus" class="filter-loc-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-semibold">On-Campus (0.0 mi)</button>
          <button onclick="setFilterLocation('off-campus')" id="loc-off-campus" class="filter-loc-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-semibold">Off-Campus (&le;10 mi)</button>
        </div>
      </div>

      <!-- Secondary Category Filters -->
      <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 text-xs">
        <span class="text-slate-500 font-medium uppercase tracking-wider mr-1">Category:</span>
        <button onclick="setFilterCat('all')" id="cat-all" class="cat-btn border border-emerald-600 bg-emerald-50 text-emerald-800 font-semibold px-2.5 py-1 rounded">All Categories</button>
        <button onclick="setFilterCat('Cleanups')" id="cat-cleanups" class="cat-btn border border-slate-200 hover:border-slate-300 text-slate-600 px-2.5 py-1 rounded">Trash & River Cleanups</button>
        <button onclick="setFilterCat('Forestry & Gardening')" id="cat-forestry" class="cat-btn border border-slate-200 hover:border-slate-300 text-slate-600 px-2.5 py-1 rounded">Tree Planting & Gardening</button>
        <button onclick="setFilterCat('Food Waste')" id="cat-food" class="cat-btn border border-slate-200 hover:border-slate-300 text-slate-600 px-2.5 py-1 rounded">Food Recovery & Composting</button>
        <button onclick="setFilterCat('Education & Advocacy')" id="cat-education" class="cat-btn border border-slate-200 hover:border-slate-300 text-slate-600 px-2.5 py-1 rounded">Education & Outreach</button>
      </div>
    </section>

    <!-- Opportunities Grid -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">Sustainability Opportunities</h3>
        <p class="text-xs text-slate-500" id="results-count">Loading opportunities...</p>
      </div>
      <div id="opportunity-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </section>

  </main>

  <script>
    // Fallback data in case sju_dashboard_opportunities.json is unavailable or loading locally
    const fallbackData = [
      {
        id: 1,
        title: "SJU Community Garden Harvesting",
        organization: "SJU Community Garden",
        type: "on-campus",
        category: "Forestry & Gardening",
        date: "Intermittent Days and Times",
        location: "Between Merion Hall and Fine Arts East, Merion Station, PA",
        description: "Assist with weeding and harvesting vegetables from the garden in support of food security initiatives.",
        distanceMiles: 0.4,
        link: "https://docs.google.com/spreadsheets/d/1Qk6LoiE9i2OwqOkW1vHwkuisQeyei5KJpiE5yyQoRw4/edit?usp=drivesdk",
        tags: ["On Campus", "Produce", "Gardening"],
        badgeColor: "bg-emerald-100 text-emerald-800"
      },
      {
        id: 2,
        title: "Barnes Arboretum Horticulture & Plant Stewardship",
        organization: "Saint Joseph's University (Barnes Arboretum)",
        type: "on-campus",
        category: "Forestry & Gardening",
        date: "Weekly Recurring Workdays • 9:30 AM - 12:30 PM",
        location: "300 N Latch's Ln, Merion Station, PA (SJU Arboretum)",
        description: "Support university horticulture staff in weeding, trail mulching, caring for heritage woody plants, and managing invasive species across SJU's 12-acre arboretum.",
        distanceMiles: 0.6,
        link: "https://docs.google.com/forms/d/1NaOrZnQemzz4jqqKN8YFOZoyo8g3uHCgjuvKPOj2abM/edit",
        tags: ["On Campus", "Arboretum", "Gardening"],
        badgeColor: "bg-emerald-100 text-emerald-800"
      }
    ];

    let opportunitiesData = [];
    let currentLocFilter = 'all';
    let currentCatFilter = 'all';

    // Fetch dynamic JSON data generated by GitHub Actions
    async function loadOpportunities() {
      try {
        // Timestamp prevents aggressive browser caching
        const response = await fetch(`sju_dashboard_opportunities.json?t=${new Date().getTime()}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        opportunitiesData = (Array.isArray(data) && data.length > 0) ? data : fallbackData;
      } catch (err) {
        console.warn("Could not load sju_dashboard_opportunities.json. Displaying fallback dataset.", err);
        opportunitiesData = fallbackData;
      } finally {
        renderCards(opportunitiesData);
      }
    }

    function renderCards(data) {
      const container = document.getElementById('opportunity-cards');
      const countEl = document.getElementById('results-count');
      if (countEl) countEl.innerText = `Showing ${data.length} opportunities`;
      
      if (!container) return;

      if (data.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">
            <i class="fa-solid fa-leaf text-3xl mb-2 text-slate-300"></i>
            <p class="font-semibold text-slate-600">No opportunities match your current filters.</p>
            <p class="text-xs">Try adjusting your location or category filters above.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
          <div class="p-5 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider ${item.badgeColor || (item.type === 'on-campus' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800')}">
                <i class="fa-solid ${item.type === 'on-campus' ? 'fa-building-columns' : 'fa-map-location-dot'} mr-1"></i>
                ${item.type === 'on-campus' ? 'On-Campus' : 'Off-Campus'}
              </span>
              <span class="text-xs font-semibold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">
                <i class="fa-solid fa-location-dot mr-1"></i> ${item.distanceMiles === 0 ? 'Hawk Hill' : (item.distanceMiles || 0) + ' mi away'}
              </span>
            </div>

            <h4 class="text-base font-bold text-slate-800 hover:text-emerald-700 transition cursor-pointer">${item.title}</h4>
            <p class="text-xs font-semibold text-slate-500"><i class="fa-solid fa-users text-slate-400 mr-1"></i> ${item.organization}</p>
            
            <div class="space-y-1 text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
              <p><i class="fa-solid fa-calendar-day text-emerald-700 w-4"></i> ${item.date}</p>
              <p><i class="fa-solid fa-location-dot text-emerald-700 w-4"></i> ${item.location}</p>
            </div>

            <p class="text-xs text-slate-600 line-clamp-3">${item.description}</p>

            <div class="flex flex-wrap gap-1 pt-1">
              ${(item.tags || []).map(t => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${t}</span>`).join('')}
            </div>
          </div>

          <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
            <span class="text-xs text-slate-500 font-medium">${item.category}</span>
            <a href="${item.link || item.registrationUrl || '#'}" target="_blank" rel="noopener noreferrer" class="bg-emerald-800 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-1.5 rounded-lg transition shadow-sm inline-flex items-center gap-1.5">
              Sign Up / RSVP <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterOpportunities() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const filtered = opportunitiesData.filter(item => {
        const matchesLoc = currentLocFilter === 'all' || item.type === currentLocFilter;
        const matchesCat = currentCatFilter === 'all' || item.category === currentCatFilter;
        const matchesSearch = (item.title && item.title.toLowerCase().includes(search)) || 
                              (item.description && item.description.toLowerCase().includes(search)) || 
                              (item.organization && item.organization.toLowerCase().includes(search)) ||
                              ((item.tags || []).some(t => t.toLowerCase().includes(search)));
        return matchesLoc && matchesCat && matchesSearch;
      });
      renderCards(filtered);
    }

    function setFilterLocation(type) {
      currentLocFilter = type;
      document.querySelectorAll('.filter-loc-btn').forEach(btn => {
        btn.className = 'filter-loc-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-full text-xs font-semibold';
      });
      const activeBtn = document.getElementById(`loc-${type}`);
      if (activeBtn) activeBtn.className = 'filter-loc-btn bg-emerald-800 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold';
      filterOpportunities();
    }

    function setFilterCat(cat) {
      currentCatFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = 'cat-btn border border-slate-200 hover:border-slate-300 text-slate-600 px-2.5 py-1 rounded';
      });
      const eventTarget = window.event && window.event.target;
      if (eventTarget) {
        eventTarget.className = 'cat-btn border border-emerald-600 bg-emerald-50 text-emerald-800 font-semibold px-2.5 py-1 rounded';
      }
      filterOpportunities();
    }

    // Initialize data loading on page ready
    document.addEventListener('DOMContentLoaded', loadOpportunities);
  </script>
</body>
</html>
